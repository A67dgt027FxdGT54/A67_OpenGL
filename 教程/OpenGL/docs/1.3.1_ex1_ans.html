    <body>
        <h1>答案</h1>
        <h3 class="inline">练习1. </h3>使用out关键字把顶点位置输出到片段着色器，并将片段的颜色设置为与顶点位置相等（来看看连顶点位置值都在三角形中被插值的结果）。做完这些后，尝试回答下面的问题：为什么在三角形的左下角是黑的？ <br>
        我们的片段的输出颜色等于（插值后的）坐标。<br>
        因为左下角的坐标是 <code>-0.5 -0.5 0.0</code>，看，两个负数。<br>
        但颜色的范围是 0.0-1.0 ，OpenGL 遂将颜色限制为 0.0。因此，这个值变为黑色。
